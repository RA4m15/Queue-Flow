# Host used for the Android App Link intent filter for the canonical
# customer queue QR (https://<host>/join?centerId=...).
#
# This is the single place to set the domain for a local build. For a one-off
# build you can override it on the command line instead:
#
#   ./gradlew assembleRelease -PqueueflowJoinHost=<host>
#
# The value MUST match:
#   * VITE_CUSTOMER_WEB_URL in live_counter/.env  (the host the QR encodes)
#   * --dart-define=QUEUEFLOW_JOIN_HOSTS=<host>   (what the app trusts)
#   * the host serving /.well-known/assetlinks.json
#
# Until assetlinks.json is published for that host, Android will not verify the
# App Link; the QR then opens the Customer Web page instead. That fallback is
# the intended behaviour and is not a defect.
#
# The default is the reserved .invalid TLD (RFC 2606), which can never resolve,
# so an unconfigured build can never be mistaken for a working deployment.
queueflowJoinHost=join.invalid
